<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <style>
      :root { color-scheme: dark; --ink:#f5f5ef; --muted:#a9afa2; --panel:#171a16; --line:#30372e; --lime:#d9ff5f; --orange:#ff7655; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#0d0f0c; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .glow { position:fixed; width:60vmax; height:60vmax; border-radius:50%; background:radial-gradient(circle,rgba(190,255,80,.12),transparent 63%); top:-32vmax; right:-23vmax; pointer-events:none; }
      main { width:min(92vw,610px); position:relative; }
      header { display:flex; justify-content:space-between; align-items:end; margin-bottom:18px; }
      h1 { margin:0; letter-spacing:-.08em; font-size:clamp(3.3rem,12vw,5.4rem); line-height:.8; font-weight:900; }
      .score { text-align:right; font-weight:800; text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; color:var(--muted); }
      .score strong { display:block; color:var(--lime); font-size:2rem; letter-spacing:-.06em; line-height:1; margin-top:3px; }
      .game { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:25px; padding:14px; box-shadow:0 25px 80px #0008; }
      canvas { display:block; width:100%; aspect-ratio:1; border-radius:15px; background:#11140f; image-rendering:pixelated; }
      .overlay { position:absolute; inset:14px; border-radius:15px; display:flex; align-items:center; justify-content:center; text-align:center; background:#0b0d0abb; backdrop-filter:blur(5px); transition:.2s; }
      .overlay.hidden { opacity:0; pointer-events:none; }
      .overlay h2 { margin:0 0 9px; font-size:2rem; letter-spacing:-.05em; }
      .overlay p { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
      button { border:0; background:var(--lime); color:#142000; border-radius:999px; padding:12px 20px; font:800 .78rem inherit; text-transform:uppercase; letter-spacing:.09em; cursor:pointer; transition:transform .15s, background .15s; }
      button:hover { transform:translateY(-2px); background:#e8ff9a; }
      footer { margin-top:16px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; }
      kbd { color:var(--ink); border:1px solid var(--line); border-bottom-width:3px; border-radius:5px; padding:3px 6px; font:700 .7rem inherit; }
      .mobile { display:none; margin:16px auto 0; width:190px; grid-template-columns:repeat(3,1fr); gap:6px; }
      .mobile button { padding:11px; border-radius:10px; background:#252b23; color:var(--ink); font-size:1rem; }
      .mobile .up { grid-column:2; }.mobile .left { grid-column:1; grid-row:2; }.mobile .down {grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}
      @media (max-width:600px), (pointer:coarse) { .mobile { display:grid; } footer span:last-child { display:none; } }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <main>
      <header><h1>SNAKE</h1><div class="score">Score<strong id="score">0</strong></div></header>
      <section class="game">
        <canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay"><div><h2 id="message">Ready to slither?</h2><p id="submessage">Collect the fruit. Avoid the walls and yourself.</p><button id="start">Start game</button></div></div>
      </section>
      <div class="mobile" aria-label="Controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
      <footer><span>Best: <b id="best">0</b></span><span>Use <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or WASD</span></footer>
    </main>
    <script>
      const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d');
      const scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),submessage=document.querySelector('#submessage'),start=document.querySelector('#start');
      const cells=20, size=canvas.width/cells; let snake,food,dir,nextDir,score,running,timer;
      let best=+localStorage.getItem('snake-best')||0; bestEl.textContent=best;
      const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
      function reset(){ snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=dirs.right;nextDir=dirs.right;score=0;scoreEl.textContent=0;food=placeFood();draw(); }
      function placeFood(){ let p; do{p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p; }
      function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
      function draw(){ctx.clearRect(0,0,600,600);ctx.strokeStyle='#1e241d';ctx.lineWidth=1;for(let i=1;i<cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,600);ctx.moveTo(0,i*size);ctx.lineTo(600,i*size);ctx.stroke();}
        ctx.fillStyle='#ff7655';roundRect(food.x*size+7,food.y*size+7,size-14,size-14,9);ctx.fillStyle='#ffe0a6';ctx.beginPath();ctx.arc(food.x*size+size*.42,food.y*size+size*.42,3,0,7);ctx.fill();
        snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#ffffff':'#dedede';roundRect(s.x*size+3,s.y*size+3,size-6,size-6,8);});
        const h=snake[0];ctx.fillStyle='#142000'; const ex=h.x*size+(dir.x===1?22:dir.x===-1?10:dir.x===0?10:10), ey=h.y*size+(dir.y===1?22:dir.y===-1?10:10);ctx.beginPath();ctx.arc(ex,ey,2.3,0,7);ctx.fill(); }
      function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const hit=head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y);if(hit)return end();snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;food=placeFood();clearInterval(timer);timer=setInterval(tick,Math.max(55,125-score*4));}else snake.pop();draw();}
      function change(name){const d=dirs[name];if(!d||(d.x===-dir.x&&d.y===-dir.y))return;nextDir=d;}
      function begin(){clearInterval(timer);reset();running=true;overlay.classList.add('hidden');timer=setInterval(tick,125);}
      function end(){clearInterval(timer);running=false;if(score>best){best=score;localStorage.setItem('snake-best',best);bestEl.textContent=best;}message.textContent='Game over';submessage.textContent=`You collected ${score} ${score===1?'fruit':'fruits'}.`;start.textContent='Play again';overlay.classList.remove('hidden');}
      addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();if(!running)begin();else change(map[e.key]);}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(!running)begin();else change(b.dataset.dir)});start.onclick=begin;reset();
    </script>
  </body>
</html>
